<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MLB Research Engine</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <h1>MLB Research Engine</h1>

    <p>Ask a question about MLB.</p>

    <div class="search-box">

      <input
        type="text"
        id="question"
        placeholder="Ask an MLB question..."
        autocomplete="off"
      >

      <button onclick="askQuestion()">
        Search
      </button>

    </div>

    <div id="answer"></div>

  </main>

  <script src="js/app.js"></script>

</body>
</html>
