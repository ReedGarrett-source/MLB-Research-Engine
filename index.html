<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Baseball Intelligence</title>

  <link
    rel="stylesheet"
    href="style.css?v=4"
  >

  <script>

    const savedTheme =
      localStorage.getItem("theme");

    if (savedTheme === "light") {

      document.documentElement.classList.add("light");

    } else if (savedTheme === "dark") {

      document.documentElement.classList.add("dark");

    } else if (
      window.matchMedia &&
      window.matchMedia(
        "(prefers-color-scheme: light)"
      ).matches
    ) {

      document.documentElement.classList.add("light");

    } else {

      document.documentElement.classList.add("dark");

    }

  </script>

</head>


<body>


  <header class="top-bar">

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
    >
      Light Mode
    </button>

  </header>


  <main>


    <section class="hero">

      <div class="badge">
        MLB DATA &amp; RESEARCH
      </div>


      <h1>

        Baseball

        <span>
          Intelligence
        </span>

      </h1>


      <p>
        Ask questions. Get the numbers.
      </p>

    </section>


    <div class="search-box">

      <input
        type="text"
        id="question"
        placeholder="Ask anything about MLB..."
        autocomplete="off"
      >


      <button
        onclick="askQuestion()"
        class="search-button"
        type="button"
      >
        Search
      </button>

    </div>


    <div class="examples">

      <span>
        Try:
      </span>


      <button
        onclick="setQuestion('Pete Alonso HR in his last 10 games')"
        type="button"
      >
        HR in last 10 games
      </button>


      <button
        onclick="setQuestion('Kodai Senga ERA in his last 10 games')"
        type="button"
      >
        Pitcher ERA
      </button>


      <button
        onclick="setQuestion('Juan Soto OPS in his last 15 games')"
        type="button"
      >
        OPS
      </button>

    </div>


    <div id="answer"></div>


  </main>


  <footer>

    Baseball Intelligence • MLB data &amp; research

  </footer>


  <script src="js/app.js"></script>


  <script>

    function setQuestion(question) {

      const input =
        document.getElementById("question");

      input.value =
        question;

      input.focus();

    }

  </script>


</body>

</html>
