<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseball Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <button id="themeToggle" class="theme-toggle">
      Light Mode
    </button>
  </header>
  <main>
    <section class="hero">
      <div class="badge">
        MLB DATA &amp; RESEARCH
      </div>
      <h1>
        MLB
        <span>Research Engine</span>
      </h1>
      <p>
        Ask questions. Get the numbers.
      </p>
    </section>
    <div class="search-box">
      <input
        type="text"
        id="question"
        placeholder="Ask anything about MLB..."
        autocomplete="off"
      >
      <button
        onclick="askQuestion()"
        class="search-button"
      >
        Search
      </button>
    </div>
    <div class="examples">
      <span>Try:</span>
      <button
        onclick="setQuestion('Pete Alonso HR in his last 10 games')"
      >
        HR in last 10 games
      </button>
      <button
        onclick="setQuestion('Kodai Senga ERA in his last 10 games')"
      >
        Pitcher ERA
      </button>
      <button
        onclick="setQuestion('Juan Soto OPS in his last 15 games')"
      >
        OPS
      </button>
    </div>
    <div id="answer"></div>
  </main>
  <script src="js/app.js"></script>
  <script>
    const themeToggle =
      document.getElementById("themeToggle");
    function updateThemeButton() {
      const isLight =
        document.body.classList.contains("light");
      themeToggle.textContent =
        isLight
          ? "Dark Mode"
          : "Light Mode";
    }
    themeToggle.addEventListener("click", function () {
      document.body.classList.toggle("light");
      const currentTheme =
        document.body.classList.contains("light")
          ? "light"
          : "dark";
      localStorage.setItem(
        "theme",
        currentTheme
      );
      updateThemeButton();
    });
    const savedTheme =
      localStorage.getItem("theme");
    if (savedTheme === "light") {
      document.body.classList.add("light");
    }
    updateThemeButton();
    function setQuestion(question) {
      document.getElementById("question").value =
        question;
      document.getElementById("question").focus();
    }
  </script>
</body>
</html>
